name: Build Release APK & Play Store AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper Exists & Executable
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating Gradle wrapper..."
            gradle wrapper || true
          fi
          chmod +x gradlew || true

      - name: Prepare Release Signing Keystore
        id: prepare_keystore
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"
          KEY_ALIAS="upload"
          
          # Default secure passwords or use repository secrets if configured
          STORE_PASS="${{ secrets.STORE_PASSWORD }}"
          KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          
          if [ -z "$STORE_PASS" ]; then
            STORE_PASS="ScanQrPro2026SecurePass"
          fi
          if [ -z "$KEY_PASS" ]; then
            KEY_PASS="ScanQrPro2026SecurePass"
          fi

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Menggunakan Keystore yang tersimpan di GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_FILE"
          else
            echo "Membuat production release keystore secara otomatis..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Scan Qr Pro, OU=Mobile, O=AI Studio, L=Jakarta, ST=Jakarta, C=ID"
          fi

          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> $GITHUB_ENV
          echo "STORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV

      - name: Build Release APK and Play Store AAB
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_FILE }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease bundleRelease --stacktrace
          else
            gradle assembleRelease bundleRelease --stacktrace
          fi

      - name: Rename Output Artifacts
        run: |
          mkdir -p build-artifacts
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp "app/build/outputs/apk/release/app-release.apk" "build-artifacts/ScanQrPro-release.apk"
          fi
          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            cp "app/build/outputs/bundle/release/app-release.aab" "build-artifacts/ScanQrPro-release.aab"
          fi
          if [ -f "$KEYSTORE_FILE" ]; then
            cp "$KEYSTORE_FILE" "build-artifacts/my-upload-key.jks"
          fi

      - name: Upload Play Store AAB (Android App Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: ScanQrPro-PlayStore-AAB
          path: build-artifacts/ScanQrPro-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Signed Release APK (Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: ScanQrPro-Release-APK
          path: build-artifacts/ScanQrPro-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Keystore & Credentials Backup
        uses: actions/upload-artifact@v4
        with:
          name: Release-Keystore-Backup
          path: build-artifacts/my-upload-key.jks
          if-no-files-found: warn
          retention-days: 30
